[project]
name = "cecam-nqs"
version = "0.1.0"
description = "Materials for the CECAM lecture on neural networks for quantum-system simulation"
authors = [
	{ name = "Zakari Denis" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
	"jax==0.10.1",
	"jaxlib==0.10.1",
	"jaxtyping==0.3.10",
	"netket==3.22.3",
	"flax==0.12.7",
	"optax==0.2.8",
	"numpy",
	"matplotlib",
	"jupyterlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cecam_nqs"]
